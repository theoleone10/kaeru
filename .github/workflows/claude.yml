name: Claude

# File an issue with the "claude" label (the bug report template adds it) and
# Claude investigates, fixes it on a branch and opens a PR against dev.
# Comment "@claude ..." on the issue or the PR to steer it.
#
# Only users with write access to the repo can trigger it (checked by the action).
# Needs the CLAUDE_CODE_OAUTH_TOKEN repo secret (from `claude setup-token`, uses your Claude subscription).
# Issue events only fire workflows from the default branch, so this file must be on dev.

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  # One run per issue/PR at a time; a new comment waits for the current run.
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude') ||
      (github.event_name == 'issues' && github.event.action == 'opened' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          label_trigger: "claude"
          base_branch: dev
          additional_permissions: |
            actions: read
          claude_args: |
            --permission-mode acceptEdits
            --allowedTools "Read,Glob,Grep,Edit,Write,WebFetch(domain:docs.expo.dev),Bash(npm test),Bash(npm test:*),Bash(npx jest:*),Bash(npm run typecheck),Bash(npm run lint),Bash(npm run test:zones),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh issue view:*)"
            --append-system-prompt "You are fixing a bug report for Kaeru, an Expo/React Native app. Follow CLAUDE.md and AGENTS.md exactly. Workflow: (1) Read the issue and find the cause in the code before changing anything. (2) Where the bug is testable, add a failing Jest test under tests/ first, then fix it. Build dates with local time, never Date.UTC. (3) Keep the change as small as the fix needs. (4) Before committing, run npm run typecheck, npm run lint and npm run test:zones, and fix anything they report. (5) When the fix is committed and pushed on your branch, open a pull request against dev with gh pr create. Title: a short description of the fix. Body: the cause, what changed, how it was tested, anything that still needs checking on a real device (you cannot run the app), and a line 'Closes #<issue number>'. (6) If you cannot find or fix the cause, do not guess: open no PR and reply on the issue with what you checked, what you suspect, and what extra details from the user would help."
