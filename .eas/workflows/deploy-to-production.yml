# Merging dev into master ships a new iOS build to App Store Connect.
# Runs on EAS (needs the GitHub repo linked on expo.dev); see README → "Releasing".
name: Deploy iOS to App Store

on:
  push:
    branches: ['master']

jobs:
  build_ios:
    name: Build iOS (production)
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit to App Store Connect
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
